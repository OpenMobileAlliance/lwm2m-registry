openapi: "3.0.0"
info:
  title: LwM2M APIs
  version: 1.1.0

servers:
  - url: https://example.com

security:
  - ApiKeyAuth: []
  - OAuth2: []

tags:
  - name: Device
  - name: Device Operation
  - name: Device Observation

paths:
  /lwm2m/v1/devices/{deviceId}:
    get:
      summary: Get device information
      operationId: getDevice
      tags:
        - Device
      parameters:
        - name: deviceId
          in: path
          description: Identifier of the device
          required: true
          schema:
            type: string
      responses:
        200:
          description: Device information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
  /lwm2m/v1/devices/{deviceId}/operations:
    post:
      tags:
        - Device Operation
      summary: Create a new device operation
      operationId: createDeviceOperation
      parameters:
      - name: deviceId
        in: path
        description: The identifier of the device
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Operation
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperation"
      responses:
        202:
          description: Operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedOperationResult"
        400:
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
    get:
      tags:
        - Device Operation
      summary: Get all the device operations
      operationId: getDeviceOperations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: deviceId
          in: path
          description: The identifier of the device
          required: true
          schema:
            type: string
      responses:
        200:
          description: Operations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PaginatedDeviceOperation"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
  /lwm2m/v1/devices/{deviceId}/operations/{operationId}:
    get:
      tags:
        - Device Operation
      summary: Get the state of a device operation
      operationId: getDeviceOperation
      parameters:
      - name: deviceId
        in: path
        description: The identifier of the device
        required: true
        schema:
          type: string
      - name: operationId
        in: path
        description: The identifier of the operation
        required: true
        schema:
          type: string
      responses:
        200:
          description: Operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceOperation"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId or operationId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
    delete:
      tags:
        - Device Operation
      summary: Delete a completed device operation
      operationId: deleteDeviceOperation
      parameters:
      - name: deviceId
        in: path
        description: The identifier of the device
        required: true
        schema:
          type: string
      - name: operationId
        in: path
        description: The identifier of the operation
        required: true
        schema:
          type: string
      responses:
        204:
          description: Operation deleted
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        403:
          description: The operation is not completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId or operationId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
  /lwm2m/v1/devices/{deviceId}/operations/{operationId}/successTargets:
    get:
      tags:
        - Device Operation
      summary: Get device operation success targets
      operationId: getDeviceOperationSuccessTargets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: deviceId
          in: path
          description: The identifier of the device
          required: true
          schema:
            type: string
        - name: operationId
          in: path
          description: The identifier of the operation
          required: true
          schema:
            type: string
      responses:
        200:
          description: Operations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SingleOperationDataReport"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId or operationId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
  /lwm2m/v1/devices/{deviceId}/operations/{operationId}/errorTargets:
    get:
      tags:
        - Device Operation
      summary: Get device operation error targets
      operationId: getDeviceOperationErrorTargets
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: deviceId
          in: path
          description: The identifier of the device
          required: true
          schema:
            type: string
        - name: operationId
          in: path
          description: The identifier of the operation
          required: true
          schema:
            type: string
      responses:
        200:
          description: Operations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SingleOperationErrorReport"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId or operationId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
  /lwm2m/v1/devices/{deviceId}/observations:
    post:
      tags:
        - Device Observation
      summary: Create a new device observation
      operationId: createDeviceObservation
      parameters:
        - name: deviceId
          in: path
          description: The identifier of the device
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: Observation
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObservation"
      responses:
        200:
          description: Observation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedObservationResult"
        400:
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
    get:
      tags:
        - Device Observation
      summary: Get all the device observations
      operationId: getDeviceObservations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: deviceId
          in: path
          description: The identifier of the device
          required: true
          schema:
            type: string
      responses:
        200:
          description: Operation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PaginatedObservation"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
  /lwm2m/v1/devices/{deviceId}/observations/{observationId}:
    get:
      tags:
        - Device Observation
      summary: Get the state of a device observation
      operationId: getDeviceObservation
      parameters:
      - name: deviceId
        in: path
        description: The identifier of the device
        required: true
        schema:
          type: string
      - name: observationId
        in: path
        description: The identifier of the observation
        required: true
        schema:
          type: string
      responses:
        200:
          description: Observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Observation"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId or observationId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
    delete:
      tags:
        - Device Observation
      summary: Delete a device observation
      operationId: deleteDeviceObservation
      parameters:
      - name: deviceId
        in: path
        description: The identifier of the device
        required: true
        schema:
          type: string
      - name: observationId
        in: path
        description: The identifier of the observation
        required: true
        schema:
          type: string
      responses:
        204:
          description: No content
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId or observationId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
  /lwm2m/v1/devices/{deviceId}/observations/{observationId}/notifications:
    get:
      tags:
        - Device Observation
      summary: Get the device observation's notifications
      operationId: getDeviceObservationNotifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: deviceId
          in: path
          description: The identifier of the device
          required: true
          schema:
            type: string
        - name: observationId
          in: path
          description: The identifier of the observation
          required: true
          schema:
            type: string
      responses:
        200:
          description: Notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PaginatedObservationNotification"
        400:
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId or observationId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
  /lwm2m/v1/devices/{deviceId}/observations/{observationId}/notifications/{notificationId}:
    get:
      tags:
        - Device Observation
      summary: Get the notification of a device observation
      operationId: getDeviceObservationNotification
      parameters:
      - name: deviceId
        in: path
        description: The identifier of the device
        required: true
        schema:
          type: string
      - name: observationId
        in: path
        description: The identifier of the observation
        required: true
        schema:
          type: string
      - name: notificationId
        in: path
        description: The identifier of the notification
        required: true
        schema:
          type: string
      responses:
        200:
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationDataNotification"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"
        404:
          description: deviceId, observationId or notificationId not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericError"

components:
  schemas:
    GenericError:
      type: object
      properties:
        code:
          type: string
          example:
            "error_0"
        message:
          type: string
          example:
            "An error occurred"
    Pagination:
      type: object
      properties:
        totalElements:
          type: integer
          example:
            1
        totalPages:
          type: integer
          example:
            1
        pageSize:
          type: integer
          example:
            10
        count:
          type: integer
          example:
            1
        page:
          type: integer
          example:
            1
        nextPage:
          type: string
          example:
            "/api/uri?page=2&size=10"
    CreateOperation:
      type: object
      oneOf:
        - $ref: "#/components/schemas/CreateOperationWithoutValue"
        - $ref: "#/components/schemas/CreateOperationWithValue"
    CreateOperationWithoutValue:
      type: object
      required:
        - operation
        - targets
      properties:
        operation:
          type: string
          enum: ["READ", "EXECUTE", "DISCOVER", "DELETE"]
        targets:
          type: array
          items:
            type: object
            required:
              - path
            properties:
              path:
                type: string
                example:
                  "/3/0/2"
    CreateOperationWithValue:
      type: object
      required:
        - operation
        - targets
      properties:
        operation:
          type: string
          enum: ["WRITE", "CREATE"]
        targets:
          type: array
          items:
            type: object
            required:
              - path
              - value
            properties:
              path:
                type: string
                example:
                  "/3/0/2"
              value:
                type: object
                example:
                  "1233456789"
    CreatedOperationResult:
      type: object
      properties:
        operationId:
          type: string
          example:
            "01CD"
    MinimalDeviceOperation:
      type: object
      properties:
        operation:
          type: string
          description: The type of the operation
          enum: ["READ", "WRITE", "EXECUTE", "DISCOVER", "CREATE", "DELETE"]
        status:
          type: string
          description: The status of the operation
          enum: ["ONGOING", "COMPLETED"]
          example: "COMPLETED"
        completenessDate:
          type: string
          format: date-time
          example: "2023-09-25T16:30:00.000Z"
    PaginatedDeviceOperation:
      type: object
      allOf:
        - properties:
            operationId:
              type: string
              example:
                "01CD"
        - $ref: "#/components/schemas/MinimalDeviceOperation"
    DeviceOperation:
      type: object
      allOf:
        - $ref: "#/components/schemas/MinimalDeviceOperation"
        - properties:
            targets:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                    example: "/3/0/2"
                  value:
                    type: object
                    example: "1233456789"
            successTargets:
              type: integer
              example: 1
            errorTargets:
              type: integer
              example: 0
            creationDate:
              type: string
              format: date-time
              example: "2023-09-25T16:30:00.000Z"
    SingleOperationDataReport:
      type: object
      required:
        - path
        - value
        - serverTimestamp
      properties:
        path:
          type: string
          example: "/3/0/2"
        value:
          type: object
          example: 1233456789
        valueType:
          type: string
          enum: ["NUMBER", "STRING", "BOOLEAN"]
        deviceTimestamp:
          type: string
          format: date-time
          example: "2023-09-25T16:30:00.000Z"
        serverTimestamp:
          type: string
          format: date-time
          example: "2023-09-25T16:30:00.000Z"
    SingleOperationErrorReport:
      type: object
      required:
        - path
        - failureReason
        - serverTimestamp
      properties:
        path:
          type: string
          example: "/3/0/2"
        failureReason:
          type: string
          example: "An error occurred"
        serverTimestamp:
          type: string
          format: date-time
          example: "2023-09-25T16:30:00.000Z"
    CreateObservation:
      type: object
      properties:
        targets:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                example: "/3/0/2"
    CreatedObservationResult:
      type: object
      properties:
        observationId:
          type: string
          example:
            "50B5"
    PaginatedObservation:
      type: object
      allOf:
        - properties:
            observationId:
              type: string
              example:
                "50B5"
    Observation:
      type: object
      allOf:
        - properties:
            creationDate:
              type: string
              format: date-time
              example:
                "2023-09-25T16:30:00.000Z"
            targets:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                    example:
                      "/3/0/2"
    CommonNotification:
      type: object
      properties:
        deviceId:
          type: string
          example:
            "example-client"
    PaginatedObservationNotification:
      oneOf:
        - $ref: "#/components/schemas/PaginatedObservationNotificationData"
        - $ref: "#/components/schemas/PaginatedObservationNotificationError"
    PaginatedObservationNotificationData:
      type: object
      required:
        - type
        - notificationId
        - serverTimestamp
      properties:
        type:
          type: string
          enum: ["DATA"]
        notificationId:
          type: string
          example:
            "A1B2"
        deviceTimestamp:
          type: string
          format: date-time
          example:
            "2023-09-25T16:30:00.000Z"
        serverTimestamp:
          type: string
          format: date-time
          example:
            "2023-09-25T16:30:00.000Z"
    PaginatedObservationNotificationError:
      type: object
      required:
        - type
        - notificationId
        - serverTimestamp
      properties:
        type:
          type: string
          enum: ["ERROR"]
        notificationId:
          type: string
          example:
            "A1B2"
        serverTimestamp:
          type: string
          format: date-time
          example:
            "2023-09-25T16:30:00.000Z"
    Value:
      type: object
      properties:
        value:
          type: object
          example:
            "1233456789"
        valueType:
          type: string
          enum: ["NUMBER", "STRING", "BOOLEAN"]
        deviceTimestamp:
          type: string
          format: date-time
          example:
            "2023-09-25T16:30:00.000Z"
        serverTimestamp:
          type: string
          format: date-time
          example:
            "2023-09-25T16:30:00.000Z"
    ResultDataNotification:
      type: object
      allOf:
        - properties:
            path:
              type: string
              example:
                "/3/0/2"
        - $ref: "#/components/schemas/Value"
    ResultErrorNotification:
      type: object
      properties:
        failureReason:
          type: string
          example:
            "Reason for failure"
        serverTimestamp:
          type: string
          format: date-time
          example:
            "2023-09-25T16:30:00.000Z"
    ObservationDataNotification:
      type: object
      allOf:
        - $ref: "#/components/schemas/CommonNotification"
        - properties:
            observationId:
              type: string
              example:
                "50B5"
            notificationId:
              type: string
              example:
                "14"
            results:
              type: array
              items:
                  $ref: "#/components/schemas/ResultDataNotification"
    Device:
      type: object
      properties:
        endpointName:
          type: string
          example: "example-client"
          readOnly: true
        binding:
          type: string
          example: "U"
        lwM2MVersion:
          type: string
          example: "1.0"
        registration:
          type: string
          format: date-time
          example: "2022-04-01T08:25:31.422+00:00"
        lifetime:
          type: number
          example: 300
        objects:
          type: array
          items:
            type: object
            properties:
              objectId:
                type: integer
                example: 1
              objectInstanceId:
                type: integer
                example: 0
              objectVersion:
                type: string
                example: "1.0"
        observations:
          type: array
          items:
            $ref: "#/components/schemas/Observation"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/DeviceOperation"

  parameters:
    Page:
      name: page
      in: query
      description: Page number
      required: false
      schema:
        type: integer
        example:
          1
    Size:
      name: size
      in: query
      description: Page size (maximum value is 30)
      required: false
      schema:
        type: integer
        example:
          10
